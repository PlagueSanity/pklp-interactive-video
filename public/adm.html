<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADM Library · Classroom Video Quiz</title>
  <script src="teacher-theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="teacher-ui.css">
</head>
<body class="teacher-page">
  <main class="teacher-shell">
    <header class="teacher-header">
      <div class="teacher-header-brand">
        <small class="teacher-eyebrow">CLASSROOM VIDEO QUIZ</small>
        <h1>Your ADM library</h1>
        <p class="teacher-header-sub">Keep each video lesson and its student results together. Create another ADM whenever your class starts a new activity.</p>
        <div class="adm-header-actions top">
          <a href="/admin.html" class="action btn-ghost-header">Teacher dashboard</a>
          <a id="create" href="/studio.html?new=1" class="action btn-pink hidden">Create new ADM</a>
        </div>
      </div>
      <div class="teacher-header-controls">
        <div class="teacher-lang-slot" data-lang-slot></div>
        <div class="control-group">
          <span class="control-label">Theme</span>
          <div class="theme-switch" role="group" aria-label="Color theme">
            <button type="button" data-theme-choice="light" aria-pressed="false">☀️ <span>Light</span></button>
            <button type="button" data-theme-choice="dark" aria-pressed="false">🌙 <span>Dark</span></button>
          </div>
        </div>
      </div>
    </header>

    <form id="login" class="login-card adm-login-card">
      <h2>Teacher sign in</h2>
      <div>
        <label for="pin">Teacher code</label>
        <input id="pin" type="password" placeholder="Enter teacher code…" autocomplete="current-password" required>
      </div>
      <button class="btn btn-full">Open library</button>
    </form>

    <p id="message" class="adm-status-bar" role="status" aria-live="polite"></p>
    <section id="lessons" class="cards" aria-label="ADM lessons"></section>
  </main>
  <script src="teacher-language.js"></script>
  <script src="adm.js"></script>
</body>
</html>
