<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM Library · Classroom Video Quiz</title><link rel="stylesheet" href="style.css"><style>
body{background:#eef3f8;color:#172337;padding:24px;font:16px/1.5 system-ui,sans-serif}main{max-width:1060px;margin:auto}header{background:#0f172a;color:white;padding:30px;border-radius:18px;margin-bottom:24px}header p{color:#bacbe0;max-width:650px}h1{margin:6px 0;font-size:2rem}h2{font-size:1.2rem;margin:0 0 8px}.top,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}a,button{font:inherit}button,.action{background:#225ce7;color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#e8effa;color:#14396b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.card,#login{background:white;border:1px solid #d9e3ef;border-radius:14px;padding:24px}.card p{color:#526680}.card .actions{margin-top:22px}label{display:block;margin:10px 0}input{font:inherit;padding:12px;width:100%;max-width:360px;border:1px solid #8d9fb6;border-radius:8px}#message{min-height:28px;color:#a31d36;margin:14px 0}.hidden{display:none!important}button:disabled{opacity:.6;cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #0891b2;outline-offset:3px}@media(max-width:500px){body{padding:12px}header,.card{padding:20px}h1{font-size:1.65rem}}
</style></head><body><main><header><small>CLASSROOM VIDEO QUIZ</small><h1>Your ADM library</h1><p>Keep each video lesson and its student results together. Create another ADM whenever your class starts a new activity.</p><div class="top"><a href="/admin.html" class="action secondary">Teacher dashboard</a><a id="create" href="/studio.html?new=1" class="action hidden">Create new ADM</a></div></header>
<form id="login"><h2>Teacher sign in</h2><label for="pin">Teacher code</label><input id="pin" type="password" autocomplete="current-password" required><button>Open library</button></form><p id="message" role="status" aria-live="polite"></p><section id="lessons" class="cards" aria-label="ADM lessons"></section></main><script src="adm.js"></script></body></html>
